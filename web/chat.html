<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/app_icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCC Multistream chat</title>
<!-- Every platform's chat in one list, with how many are watching on each.
     Shown beside the control panel, in its own window, or in OBS as a custom
     browser dock (http://127.0.0.1:8775/chat.html). -->
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  :root { --text: #f2f5f2; --muted: rgba(242, 245, 242, .62); --line: rgba(255, 255, 255, .14); --gold: #f5c400; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #08120c; color: var(--text); font: 14px/1.4 "Inter", system-ui, sans-serif; display: flex; flex-direction: column; }
  body.embed { background: transparent; }
  header { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .total { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .total small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; border-radius: 12px; background: rgba(255, 255, 255, .08);
          font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.off { color: var(--muted); }
  .chip img, .msg .logo { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; flex: none; }
  .logo.tiktok, .chip img.tiktok { background: #fff; padding: 1px; }
  header button { margin-left: auto; font: inherit; font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer;
                  background: rgba(0, 0, 0, .45); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  header button:hover { border-color: var(--gold); }
  #list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .msg { display: flex; gap: 8px; padding: 4px 12px; overflow-wrap: anywhere; }
  .msg .logo { margin-top: 2px; }
  .msg .who { font-weight: 700; margin-right: 6px; }
  .msg .body img { height: 22px; vertical-align: middle; margin: -3px 1px; }
  .msg.paid { background: rgba(245, 196, 0, .12); border-left: 3px solid var(--gold); }
  .msg.event { color: var(--muted); font-style: italic; }
  .amount { color: var(--gold); font-weight: 700; margin-right: 6px; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  #more { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: inherit; font-size: 12px; font-weight: 700;
          background: var(--gold); color: #1d1600; border: 0; border-radius: 14px; padding: 5px 12px; cursor: pointer; }
  ::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3d44; border: 3px solid transparent; border-radius: 8px; background-clip: padding-box; }
  ::-webkit-scrollbar-button { display: none; }
</style>
</head>
<body>
<header>
  <span class="total" id="total">0 <small>watching</small></span>
  <span class="chips" id="chips"></span>
  <button id="popout" hidden>Open in its own window</button>
</header>
<div id="list"><div class="empty" id="empty">Chat from Twitch, YouTube and Facebook shows here once a platform is switched on and logged in (or, for Twitch and YouTube, has its chat channel set). X and TikTok don't let apps read their chat.</div></div>
<button id="more" hidden>New messages ↓</button>
<script>
const $ = id => document.getElementById(id);
const LOGOS = ["youtube", "twitch", "x", "tiktok", "facebook"];
const NAMES = { youtube: "YouTube", twitch: "Twitch" };
const embed = new URLSearchParams(location.search).has("embed");
document.body.classList.toggle("embed", embed);
$("popout").hidden = !embed;
$("popout").onclick = () => fetch("/api/chat/window", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });

const logo = p => LOGOS.includes(p) ? `<img class="logo ${p}" src="assets/platforms/${p}.png" alt="">` : "";
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const DEFAULT_COLORS = ["#ff7a7a", "#7ab8ff", "#8cf08c", "#ffb86b", "#d59cff", "#6be0d8", "#ffd86b"];
function colorFor(name, color) {
  if (color) return color;
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0;
  return DEFAULT_COLORS[Math.abs(h) % DEFAULT_COLORS.length];
}

function renderViewers(viewers) {
  const list = Object.values(viewers);
  const total = list.reduce((n, v) => n + (v.viewers || 0), 0);
  $("total").innerHTML = `${total.toLocaleString()} <small>watching</small>`;
  $("chips").innerHTML = list.map(v => {
    const live = v.viewers != null;
    const tip = v.status === "error" ? v.message : v.message || (live ? "" : "Not live");
    return `<span class="chip ${live ? "" : "off"}" title="${esc(tip)}">${logo(v.platform)}${live ? v.viewers.toLocaleString() : "–"}</span>`;
  }).join("");
}

let after = 0;
const list = $("list");
function atBottom() { return list.scrollTop + list.clientHeight >= list.scrollHeight - 30; }
list.onscroll = () => { if (atBottom()) $("more").hidden = true; };
$("more").onclick = () => { list.scrollTop = list.scrollHeight; $("more").hidden = true; };

function add(m) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + m.kind;
  const body = m.parts.map(p => p.img ? `<img src="${esc(p.img)}" alt="${esc(p.alt)}" title="${esc(p.alt)}">` : esc(p.t)).join("");
  div.innerHTML = `${logo(m.platform)}<div><span class="who" style="color:${esc(colorFor(m.author, m.color))}">${esc(m.author)}</span>`
    + (m.amount ? `<span class="amount">${esc(m.amount)}</span>` : "") + `<span class="body">${body}</span></div>`;
  list.appendChild(div);
  while (list.children.length > 400) list.firstChild.remove();
}

async function poll() {
  try {
    const data = await (await fetch("/api/chat?after=" + after)).json();
    const stick = atBottom();
    for (const m of data.messages) { add(m); after = m.id; }
    renderViewers(data.viewers);
    if (data.messages.length) {
      if (stick) list.scrollTop = list.scrollHeight;
      else $("more").hidden = false;
    }
  } catch (e) { /* the app is closing */ }
}
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
